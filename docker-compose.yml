services:
  mongodb:
    image: mongo:7
    container_name: execution-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: execution
      MONGO_INITDB_ROOT_PASSWORD: execution
      MONGO_INITDB_DATABASE: execution
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
