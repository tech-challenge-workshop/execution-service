# Datadog Agent is shared across services and started by work-order-service's
# docker-compose.yml (same convention as the shared RabbitMQ broker). Point
# DD_AGENT_HOST at that agent's published APM port (see .env.example).
services:
  mongodb:
    image: mongo:7
    container_name: execution-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: execution
      MONGO_INITDB_ROOT_PASSWORD: execution
      MONGO_INITDB_DATABASE: execution
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
